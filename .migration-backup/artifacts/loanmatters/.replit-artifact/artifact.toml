kind = "web"
previewPath = "/"
title = "LoanMatters"
version = "1.0.0"
id = "artifacts/loanmatters"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21231

[services.development]
run = "pnpm --filter @workspace/loanmatters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/loanmatters", "run", "build" ]
publicDir = "artifacts/loanmatters/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21231"
BASE_PATH = "/"
